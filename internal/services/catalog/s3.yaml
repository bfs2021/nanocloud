id: s3
name: S3 storage
category: storage
description: >-
  S3-compatible object storage (SeaweedFS), with an access key ready for the
  AWS CLI or any S3 client.
image: ubuntu-24.04
sizes:
  - {id: small, label: Small, vcpus: 1, memory_mb: 1024, disk_gb: 20}
  - {id: medium, label: Medium, vcpus: 2, memory_mb: 2048, disk_gb: 50, default: true}
  - {id: large, label: Large, vcpus: 2, memory_mb: 4096, disk_gb: 100}
params:
  - {id: access_key, label: Access key, generate: 20, charset: upper}
  - {id: secret_key, label: Secret key, generate: 40, secret: true}
ports: [8333]
install: |
  arch=$(dpkg --print-architecture)
  curl -fsSL "https://github.com/seaweedfs/seaweedfs/releases/latest/download/linux_${arch}.tar.gz" -o /tmp/weed.tgz
  tar -xzf /tmp/weed.tgz -C /usr/local/bin weed
  rm -f /tmp/weed.tgz
  install -d -m 700 /etc/seaweedfs /var/lib/seaweedfs
  cat > /etc/seaweedfs/s3.json <<'JSON'
  {"identities": [{"name": "nanocloud", "credentials": [{"accessKey": "{{.access_key}}", "secretKey": "{{.secret_key}}"}], "actions": ["Admin", "Read", "List", "Tagging", "Write"]}]}
  JSON
  chmod 600 /etc/seaweedfs/s3.json
  # Master, volume and filer stay on loopback; only the S3 port is for clients.
  # 1 GB volumes, as many as the disk holds: the 30 GB default would not fit one.
  cat > /etc/systemd/system/seaweedfs.service <<'UNIT'
  [Unit]
  Description=SeaweedFS S3 storage (nano-cloud)
  After=network-online.target
  Wants=network-online.target

  [Service]
  ExecStart=/usr/local/bin/weed server -dir=/var/lib/seaweedfs -ip=127.0.0.1 -ip.bind=127.0.0.1 -master.volumeSizeLimitMB=1024 -volume.max=0 -s3 -s3.port=8333 -s3.ip.bind=0.0.0.0 -s3.config=/etc/seaweedfs/s3.json
  Restart=on-failure

  [Install]
  WantedBy=multi-user.target
  UNIT
  systemctl daemon-reload
  systemctl enable --now seaweedfs
  for _ in $(seq 1 60); do
    if curl -s -o /dev/null http://127.0.0.1:8333/; then break; fi
    sleep 2
  done
  curl -s -o /dev/null http://127.0.0.1:8333/
endpoints:
  - {id: s3, label: S3 API, port: 8333, scheme: http}
outputs:
  - {id: endpoint, label: Endpoint, value: "http://{{.addr_s3}}"}
  - {id: access_key, label: Access key, value: "{{.access_key}}"}
  - {id: secret_key, label: Secret key, value: "{{.secret_key}}", secret: true}
  - id: aws
    label: Try it
    secret: true
    value: "AWS_ACCESS_KEY_ID={{.access_key}} AWS_SECRET_ACCESS_KEY={{.secret_key}} aws --endpoint-url http://{{.addr_s3}} s3 mb s3://demo"
